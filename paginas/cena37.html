<body>

Recomeçar diálogo

</button>

</div>

</div>



<script>

/*==============================================

ESCREVA CADA TRECHO DA HISTÓRIA.

Cada item será mostrado separadamente.

==============================================*/

const dialogos=[

` O resto do seu ano foi tranquilo, o Aether aos poucos está conseguindo recuperar sua autoconfiança, ainda falta muito para ele estar 100%, mas já está sendo um grande passo,`,

`os valentões que faziam parte da turma do Creta agora tem receio de de aproximar de você`,

`e por falar no Creta, os pais dele decidiram que era melhor para o minotauro ir para uma escola no exterior pois ele foi expulso e foi revelado todas as suas ações em relação ao bullying por isso ele vai para um local onde ninguém saiba o que o tal fez,`,

`já você e o Aether puderam aproveitar até a formatura em paz.`

];



const velocidade=35;

const texto=document.getElementById("texto");

const reiniciar=document.getElementById("reiniciar");

let pagina=0;

let letra=0;

reiniciar.style.display="none";



function escrever(){

if(letra<dialogos[pagina].length){

texto.innerHTML+=dialogos[pagina].charAt(letra);

letra++;

setTimeout(escrever,velocidade);

}

else{

if(pagina<dialogos.length-1){

setTimeout(proximaPagina,1000);

}

else{

reiniciar.style.display="inline-block";

}

}

}



function proximaPagina(){

texto.innerHTML="";

letra=0;

pagina++;

escrever();

}



escrever();



reiniciar.onclick=function(){

pagina=0;

letra=0;

texto.innerHTML="";

reiniciar.style.display="none";

escrever();

}

</script>

</body>
