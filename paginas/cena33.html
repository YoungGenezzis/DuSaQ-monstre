<body>

<div class="dialogo">

<div id="texto"></div>


<div class="botoes">

<a href="cena35.html">

<button id="escolha">

Continuar

</button>

</a>


<button id="reiniciar">

Recomeçar diálogo

</button>

</div>

</div>



<script>

/*==============================================

ESCREVA CADA TRECHO DA HISTÓRIA.

Cada item será mostrado separadamente.

==============================================*/

const dialogos=[

`você ao sentir a desconfiança e ódio na fala de Creta decide fazer a única coisa que ele não esperaria, dizer a verdade.`,

`" Eu não confio em você, vou escolher outra"`,

`parecendo até que você já viu o resultado das escolhas antes de acontecerem você faz o idiota minotauro cair com tudo na sua armadinha`,

`"-o que ?!?!?! Não!!!!"`,

` agora as palavras que antes ele usava para intimidar os outros agora estão alertando ele sobre seu crasso erro,`

];



const velocidade=35;

const texto=document.getElementById("texto");

const reiniciar=document.getElementById("reiniciar");

let pagina=0;

let letra=0;

reiniciar.style.display="none";



function escrever(){

if(letra<dialogos[pagina].length){

texto.innerHTML+=dialogos[pagina].charAt(letra);

letra++;

setTimeout(escrever,velocidade);

}

else{

if(pagina<dialogos.length-1){

setTimeout(proximaPagina,1000);

}

else{

reiniciar.style.display="inline-block";

}

}

}



function proximaPagina(){

texto.innerHTML="";

letra=0;

pagina++;

escrever();

}



escrever();



reiniciar.onclick=function(){

pagina=0;

letra=0;

texto.innerHTML="";

reiniciar.style.display="none";

escrever();

}

</script>

</body>

</html>
