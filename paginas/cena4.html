</head>

<body>

</audio>


<div class="dialogo">

    <div id="texto"></div>

    <div class="botoesEscolha">

        <!-- BOTÃO ESQUERDO -->

        <a href="cena8.html">
            <button id="botaoEsquerdo">

            Ignorar e passar reto

            </button>
        </a>


        <!-- BOTÃO REINICIAR -->

        <button id="reiniciar">

            Recomeçar diálogo

        </button>


        <!-- BOTÃO DIREITO -->

        <a href="cena5.html">
            <button id="botaoDireito">

                Intervir na Briga

            </button>
        </a>

    </div>

</div>



<script>

/*========================================================

TEXTO DA NARRAÇÃO

Escreva o texto abaixo.

========================================================*/

const dialogos=[

`você mal chega e já vê seu primeiro clichê se desenrolar, `,

`na sua visão aparece um minotauro valentão  com topete que é atrapalhado pelos chifres está gritando com alguém semelhante à uma pixie encolhida em seus livros de física quântica da relatividade que geralmente seriam vistos em algo semelhante a um pós-mestrado`,

`o que você quer fazer?`

];


/*========================================================

VELOCIDADE DA DIGITAÇÃO

Quanto menor, mais rápido.

========================================================*/

const velocidade = 35;

const texto = document.getElementById("texto");

const reiniciar = document.getElementById("reiniciar");

let pagina = 0;

let letra = 0;

reiniciar.style.display = "none";

function escrever(){

    if(letra < dialogos[pagina].length){

        texto.innerHTML += dialogos[pagina].charAt(letra);

        letra++;

        setTimeout(escrever, velocidade);

    }

    else{

        if(pagina < dialogos.length-1){

            setTimeout(proximaPagina,1000);

        }

        else{

            reiniciar.style.display="inline-block";

        }

    }

}

function proximaPagina(){

    texto.innerHTML="";

    letra=0;

    pagina++;

    escrever();

}

escrever();

reiniciar.onclick=function(){

    pagina=0;

    letra=0;

    texto.innerHTML="";

    reiniciar.style.display="none";

    escrever();



}

</script>

</body>
</html>
