<body>

<div class="botoes">

<a href="cena32.html">

<button id="escolha">

Continuar

</button>

</a>


<button id="reiniciar">

Recomeçar diálogo

</button>

</div>

</div>



<script>

/*==============================================

ESCREVA CADA TRECHO DA HISTÓRIA.

Cada item será mostrado separadamente.

==============================================*/

const dialogos=[

`você decide acabar logo com isso então decide passar a resposta errada novamente porém..`,

`"Eu não confio em você, vou escolher outra",`,

` por algum motivo, mesmo com 33% de chance de acerto, parece que a deusa da sorte quer que você esteja em um caixão até o fim da tarde`,

`"acertei e você tá morto"`,

`agora você acabou de comprar sua passagem para o fim dos tempos,`,

`a parte boa, o Aether etá livre do bullying,`,

`a parte extremamente ruim,`,

` você é o alvo principal a partir de agora`

];



const velocidade=35;

const texto=document.getElementById("texto");

const reiniciar=document.getElementById("reiniciar");

let pagina=0;

let letra=0;

reiniciar.style.display="none";



function escrever(){

if(letra<dialogos[pagina].length){

texto.innerHTML+=dialogos[pagina].charAt(letra);

letra++;

setTimeout(escrever,velocidade);

}

else{

if(pagina<dialogos.length-1){

setTimeout(proximaPagina,1000);

}

else{

reiniciar.style.display="inline-block";

}

}

}



function proximaPagina(){

texto.innerHTML="";

letra=0;

pagina++;

escrever();

}



escrever();



reiniciar.onclick=function(){

pagina=0;

letra=0;

texto.innerHTML="";

reiniciar.style.display="none";

escrever();

}

</script>

</body>
