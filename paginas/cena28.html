<script>

/*========================================================

TEXTO DA NARRAÇÃO

Escreva o texto abaixo.

========================================================*/

const dialogos=[

`!prova de matemática!`,

`Você tem um cubo de aresta 3cm e quer esculpir um cubo menor de aresta 1cm nele`,

`quanto ainda vai sobrar do cubo original?!`,


];


/*========================================================

VELOCIDADE DA DIGITAÇÃO

Quanto menor, mais rápido.

========================================================*/

const velocidade = 35;

const texto = document.getElementById("texto");

const reiniciar = document.getElementById("reiniciar");

let pagina = 0;

let letra = 0;

reiniciar.style.display = "none";

function escrever(){

    if(letra < dialogos[pagina].length){

        texto.innerHTML += dialogos[pagina].charAt(letra);

        letra++;

        setTimeout(escrever, velocidade);

    }

    else{

        if(pagina < dialogos.length-1){

            setTimeout(proximaPagina,1000);

        }

        else{

            reiniciar.style.display="inline-block";

        }

    }

}

function proximaPagina(){

    texto.innerHTML="";

    letra=0;

    pagina++;

    escrever();

}

escrever();

reiniciar.onclick=function(){

    pagina=0;

    letra=0;

    texto.innerHTML="";

    reiniciar.style.display="none";

    escrever();



}

</script>
