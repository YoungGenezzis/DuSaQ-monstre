</button>

<script>

/*==============================================

ESCREVA CADA TRECHO DA HISTÓRIA.

Cada item será mostrado separadamente.

==============================================*/

const dialogos=[

`por medo de ser transformado em carne para um par de espetos presos à cabeça de um minotauro, você passa as respostas,`,

`porém você tem um flash do rosto de pesar da pequena fada então decide entregar a resposta errada para ele, mas ao anotar essa resposta errada o Creta vê as marcas vermelhas instaurando-se no papel dizendo que a sua resposta era errada`,

`"Que?!?!? Carne nova, depois dessa prova você está ferrado, eu nunca mais confio em você"`,

`agora mesmo com medo do que você vai enfrentar a seguir agora é hora da...`

];



const velocidade=35;

const texto=document.getElementById("texto");

const reiniciar=document.getElementById("reiniciar");

let pagina=0;

let letra=0;

reiniciar.style.display="none";



function escrever(){

if(letra<dialogos[pagina].length){

texto.innerHTML+=dialogos[pagina].charAt(letra);

letra++;

setTimeout(escrever,velocidade);

}

else{

if(pagina<dialogos.length-1){

setTimeout(proximaPagina,1000);

}

else{

reiniciar.style.display="inline-block";

}

}

}



function proximaPagina(){

texto.innerHTML="";

letra=0;

pagina++;

escrever();

}



escrever();



reiniciar.onclick=function(){

pagina=0;

letra=0;

texto.innerHTML="";

reiniciar.style.display="none";

escrever();

}

</script>
