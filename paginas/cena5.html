</head>

<body>

<div class="dialogo">

<div id="texto"></div>


<div class="botoes">

<a href="cena6.html">

<button id="escolha">

Continuar

</button>

</a>


<button id="reiniciar">

Recomeçar diálogo

</button>

</div>

</div>



<script>

/*==============================================

ESCREVA CADA TRECHO DA HISTÓRIA.

Cada item será mostrado separadamente.

==============================================*/

const dialogos=[

`você mesmo não entendendo nada sobre essa confusão decide intervir entre a monstruosa fera e a pequenina fada"`,

`qual é a sua mano?!- "exclama o touro bípede com seus olhos já trocando o alvo para qual vai ser os seus chifres, mas por algum motivo idiota você insiste em se manter firme na sua decisão como se tivesse feito a escolha em um jogo e não tem mais volta"`,

`Se tá querendo arranjar problema veio ao lugar certo carne nova -`

];



const velocidade=35;

const texto=document.getElementById("texto");

const reiniciar=document.getElementById("reiniciar");

let pagina=0;

let letra=0;

reiniciar.style.display="none";



function escrever(){

if(letra<dialogos[pagina].length){

texto.innerHTML+=dialogos[pagina].charAt(letra);

letra++;

setTimeout(escrever,velocidade);

}

else{

if(pagina<dialogos.length-1){

setTimeout(proximaPagina,1000);

}

else{

reiniciar.style.display="inline-block";

}

}

}



function proximaPagina(){

texto.innerHTML="";

letra=0;

pagina++;

escrever();

}



escrever();



reiniciar.onclick=function(){

pagina=0;

letra=0;

texto.innerHTML="";

reiniciar.style.display="none";

escrever();

}

</script>

</body>

</html>
