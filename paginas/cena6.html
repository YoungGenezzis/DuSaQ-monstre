<div class="botoes">

</button>

<button id="reiniciar">

Recomeçar diálogo

</button>

</div>

</div>



<script>

/*==============================================

ESCREVA CADA TRECHO DA HISTÓRIA.

Cada item será mostrado separadamente.

==============================================*/

const dialogos=[

`ele dá uma cabeçada com uma força avassaladora em você,`,

`por "sorte" sua seu corpo não foi perfurado pelos enormes chifres, mas essa sorte não te ajudou na hora em que sua máscara caiu bem na sua frente,`,

` você ainda meio zonzo apenas vê o olhar da fera passar de puro ódio para uma curiosidade assombrosa que se espalha para todos os telespectadores da situação.`,

];



const velocidade=35;

const texto=document.getElementById("texto");

const reiniciar=document.getElementById("reiniciar");

let pagina=0;

let letra=0;

reiniciar.style.display="none";



function escrever(){

if(letra<dialogos[pagina].length){

texto.innerHTML+=dialogos[pagina].charAt(letra);

letra++;

setTimeout(escrever,velocidade);

}

else{

if(pagina<dialogos.length-1){

setTimeout(proximaPagina,1000);

}

else{

reiniciar.style.display="inline-block";

}

}

}



function proximaPagina(){

texto.innerHTML="";

letra=0;

pagina++;

escrever();

}



escrever();



reiniciar.onclick=function(){

pagina=0;

letra=0;

texto.innerHTML="";

reiniciar.style.display="none";

escrever();

}

</script>

</body>
