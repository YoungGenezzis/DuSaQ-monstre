<div class="botoes">

</button>

<button id="reiniciar">

Recomeçar diálogo

</button>

</div>

</div>



<script>

/*==============================================

ESCREVA CADA TRECHO DA HISTÓRIA.

Cada item será mostrado separadamente.

==============================================*/

const dialogos=[


`Seu primeiro dia e último ano de aula, uma sensação de êxtase e uma ansiedade mortal percorrem o seu frágil corpo humano`,

` a parte boa é que você não aparenta ser humano aos olhos deles, por incrível que pareça, a fantasia que você comprou na lojinha de R$10,00 feita com com pelo sintético, couro vagabundo e perfume à base de chorume parecem estranhamente indistinguíveis de um monstro real para qualquer criatura que vê,`,

` porém não se deixe ser enganado pela facilidade do disfarce, qualquer tropeço pode ser responsável pela revelação da sua identidade,`,

`por isso seu plano é só tirar boas notas e ficar na encolha até o ano acabar".`

];



const velocidade=35;

const texto=document.getElementById("texto");

const reiniciar=document.getElementById("reiniciar");

let pagina=0;

let letra=0;

reiniciar.style.display="none";



function escrever(){

if(letra<dialogos[pagina].length){

texto.innerHTML+=dialogos[pagina].charAt(letra);

letra++;

setTimeout(escrever,velocidade);

}

else{

if(pagina<dialogos.length-1){

setTimeout(proximaPagina,1000);

}

else{

reiniciar.style.display="inline-block";

}

}

}



function proximaPagina(){

texto.innerHTML="";

letra=0;

pagina++;

escrever();

}



escrever();



reiniciar.onclick=function(){

pagina=0;

letra=0;

texto.innerHTML="";

reiniciar.style.display="none";

escrever();

}

</script>

</body>

</html>
